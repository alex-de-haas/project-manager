name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Check docs index and headers
        env:
          DOCS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          DOCS_HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --test scripts/docs-format.test.mjs scripts/docs-git.test.mjs
          node scripts/docs-index.mjs --check
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  release-contract:
    name: Release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test scripts/releases/*.test.mjs
      - run: node scripts/docs-index.mjs --check

  ci-required:
    name: ci-required
    if: always()
    needs: [verify, release-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'if (Object.values(JSON.parse(process.env.RESULTS)).some(job => job.result !== "success")) process.exit(1)'
